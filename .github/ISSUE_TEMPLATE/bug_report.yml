name: Bug Report
description: Report a bug in Baraja Generator
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what went wrong
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
      placeholder: Tell us what should happen
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: What version of Baraja Generator are you using?
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: macos-version
    attributes:
      label: macOS version
      description: What macOS version are you running?
      options:
        - macOS 15 Sequoia
        - macOS 14 Sonoma
        - macOS 13 Ventura
        - Other (please specify in description)
    validations:
      required: true

  - type: dropdown
    id: api-provider
    attributes:
      label: API Provider
      description: Which AI provider were you using when the bug occurred?
      options:
        - Gemini (Google)
        - OpenAI
        - Both
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console output / Error messages
      description: Please copy any error messages from the app's console
      placeholder: Paste error messages or console output here
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues to see if this bug was already reported
          required: true
        - label: I am using the latest version of Baraja Generator
          required: false
        - label: I have valid API keys configured
          required: false
